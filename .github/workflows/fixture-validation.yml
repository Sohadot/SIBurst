name: Fixture validation

# Validation only. This workflow never builds, publishes, or deploys anything.

on:
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "SITE_ARCHITECTURE.md"
      - "INTERFACE_CONTRACT.md"
      - "VISUAL_SYSTEM.md"
      - "MOTION_SEMANTICS.md"
      - "RESPONSIVE_ACCESSIBILITY.md"
      - "INTERFACE_ACCEPTANCE.md"
      - "DEMONSTRATION_FIXTURE.md"
      - "DECISION_LOG.md"
      - ".github/workflows/fixture-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "SITE_ARCHITECTURE.md"
      - "INTERFACE_CONTRACT.md"
      - "VISUAL_SYSTEM.md"
      - "MOTION_SEMANTICS.md"
      - "RESPONSIVE_ACCESSIBILITY.md"
      - "INTERFACE_ACCEPTANCE.md"
      - "DEMONSTRATION_FIXTURE.md"
      - "DECISION_LOG.md"
      - ".github/workflows/fixture-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fixture
        run: python tools/validate_fixture.py
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
