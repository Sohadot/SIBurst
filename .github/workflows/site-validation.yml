name: Site validation

# Validation only. This workflow builds into the runner to check the committed
# docs/ against the sources. It never publishes, uploads, or deploys anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Validate fixture (Gate 0)
        run: python tools/validate_fixture.py
      - name: Run fixture tests
        run: python -m unittest discover -s tests -p "test_fixture.py" -v
      - name: Check docs/ is the build output
        run: python tools/build_site.py --check
      - name: Validate site
        run: python tools/validate_site.py
      - name: Accessibility preflight (automated; does not satisfy Test 17)
        run: python tools/preflight_accessibility.py
      - name: Run all Python tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node tests
        run: node --test tests/site-state.test.mjs
